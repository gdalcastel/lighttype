name: lighttype

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8765:8765"
    environment:
      BAMBU_CONNECT_EXPORT_DIR: /exports
      # Absolute path on the host machine (must match the bind mount below).
      # Example: BAMBU_CONNECT_HOST_PATH=/Users/you/btbw/lighttype/data/bambu-export
      BAMBU_CONNECT_HOST_PATH: ${BAMBU_CONNECT_HOST_PATH:-}
    volumes:
      - ${BAMBU_CONNECT_HOST_PATH:-./data/bambu-export}:/exports
    restart: unless-stopped

  web:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        API_URL: http://api:8765
    ports:
      - "43127:43127"
    environment:
      API_URL: http://api:8765
      PORT: "43127"
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
